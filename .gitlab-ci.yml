include:
  - project: 'ci-tools/container-image-ci-templates'
    file: '/buildah-image.gitlab-ci.yml'

stages:
  - publish

variables:
  HARBOR_REGISTRY: registry.cern.ch
  HARBOR_PROJECT: opensearch
  HARBOR_OPERATOR_IMAGE: opensearch-operator
  HARBOR_CHARTS_PATH: charts

.opensearch-operator-image:
  extends: .build_docker_image_with_buildah_and_storage_overlay
  variables:
    CI_REGISTRY: $HARBOR_REGISTRY
    DOCKER_FILE_NAME: opensearch-operator/Dockerfile
  before_script:
    - |
      if [ -z "${REGISTRY_USER}" ] || [ -z "${REGISTRY_PASSWORD}" ]; then
        echo "REGISTRY_USER and REGISTRY_PASSWORD must contain Harbor credentials." >&2
        exit 1
      fi

      IMAGE_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_VERSION="${CI_COMMIT_TAG#cern-v}"
        IMAGE_VERSION="${IMAGE_VERSION#v}"
        IMAGE_VERSION="${IMAGE_VERSION}-cern"
      fi
      export REGISTRY_IMAGE_PATH="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_OPERATOR_IMAGE}:${IMAGE_VERSION}"
    - cp LICENSE opensearch-operator/LICENSE
    - cd opensearch-operator
    - !reference [.build_docker_image_with_buildah_and_storage_overlay, before_script]

publish-image:
  extends: .opensearch-operator-image
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "cern/main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
  script:
    - !reference [.build_docker_image_with_buildah_and_storage_overlay, script]

publish-operator-chart:
  stage: publish
  image: alpine/helm:3.15.4
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "cern/main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
  script:
    - mkdir -p dist/helm
    - |
      CHART_VERSION="$(awk '/^version:/ { print $2; exit }' charts/opensearch-operator/Chart.yaml)"
      APP_VERSION="$CI_COMMIT_SHORT_SHA"
      if [ -z "$CI_COMMIT_TAG" ]; then
        CHART_VERSION="${CHART_VERSION}+cern.${CI_COMMIT_SHORT_SHA}"
      else
        RELEASE_VERSION="${CI_COMMIT_TAG#cern-v}"
        RELEASE_VERSION="${RELEASE_VERSION#v}"
        CHART_VERSION="${RELEASE_VERSION}-cern"
        APP_VERSION="${RELEASE_VERSION}-cern"
      fi
    - helm dependency update charts/opensearch-operator
    - helm lint charts/opensearch-operator
    - helm package charts/opensearch-operator --version "$CHART_VERSION" --app-version "$APP_VERSION" --destination dist/helm
    - set -- dist/helm/*.tgz
    - |
      if [ -z "${REGISTRY_USER}" ] || [ -z "${REGISTRY_PASSWORD}" ]; then
        echo "REGISTRY_USER and REGISTRY_PASSWORD must contain Harbor credentials." >&2
        exit 1
      fi
      printf '%s' "$REGISTRY_PASSWORD" | helm registry login "$HARBOR_REGISTRY" --username "$REGISTRY_USER" --password-stdin
    - helm push "$1" "oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_CHARTS_PATH}"
