{{- if .Values.manager.imagePullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opensearch-operator.imagePullSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opensearch-operator.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "opensearch-operator.imagePullSecretDockerConfigJson" . }}
{{- end }}
